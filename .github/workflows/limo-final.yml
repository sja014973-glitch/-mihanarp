name: MihanRP LimoHost Package

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        uses: knryuu/pawn-compiler-action@v1
        with:
          input: gamemodes/new.pwn
          includes: pawno/include

      - name: Build package
        run: |
          set -e

          rm -rf MihanRP_Limo_Final
          mkdir -p MihanRP_Limo_Final/gamemodes
          mkdir -p MihanRP_Limo_Final/plugins
          mkdir -p MihanRP_Limo_Final/scriptfiles

          cp gamemodes/new.amx MihanRP_Limo_Final/gamemodes/new.amx
          cp mihanrp.sql MihanRP_Limo_Final/mihanrp.sql

          cp plugins/crashdetect.so MihanRP_Limo_Final/plugins/
          cp plugins/mysql.so MihanRP_Limo_Final/plugins/
          cp plugins/sscanf.so MihanRP_Limo_Final/plugins/
          cp plugins/streamer.so MihanRP_Limo_Final/plugins/

          cat > MihanRP_Limo_Final/server.cfg <<'CFG'
lanmode 0
rcon_password CHANGE_THIS_PASSWORD
hostname MihanRP
gamemode0 new 1
filterscripts
announce 0
query 1
weburl mihanrp.ir
onfoot_rate 40
incar_rate 40
weapon_rate 40
chatlogging 0
stream_distance 150.0
stream_rate 1000
language FA/EN
plugins crashdetect.so mysql.so sscanf.so streamer.so
port 10564
maxplayers 1000
maxnpc 2
CFG

          cat > MihanRP_Limo_Final/README_LIMO.txt <<'TXT'
MihanRP LimoHost package.

Keep the existing LimoHost samp03svr.
Upload the contents of this folder to the server root.
Import mihanrp.sql into the configured MySQL database.
TXT

          zip -r -9 MihanRP_Limo_Final.zip MihanRP_Limo_Final

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: MihanRP_Limo_Final
          path: MihanRP_Limo_Final.zip
          retention-days: 14
